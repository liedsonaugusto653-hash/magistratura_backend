# Profile: cloud (Railway + Supabase/Neon + Groq)
# SPRING_PROFILES_ACTIVE=cloud

spring:
  main:
    lazy-initialization: false
    banner-mode: off

  jmx:
    enabled: false

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:magistratura}?sslmode=${DB_SSLMODE:require}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:2}
      minimum-idle: 1
      connection-timeout: 15000
      idle-timeout: 180000
      max-lifetime: 600000

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:12MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}


server:
  port: ${PORT:8080}

  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}
      min-spare: 1


springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}

  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}


management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

  health:
    diskspace:
      enabled: false

    db:
      enabled: true


logging:
  level:
    root: INFO
    ao.magistratura: INFO
    org.hibernate.SQL: WARN


app:

  jwt:
    secret: ${JWT_SECRET}


  knowledge:

    # Cloud começa sem RAG pesado
    vector-store: ${KNOWLEDGE_VECTOR_STORE:noop}

    indexer: ${KNOWLEDGE_INDEXER:knowledge}

    embedding-provider: ${KNOWLEDGE_EMBEDDING_PROVIDER:ollama}

    embedding-fail-soft: ${KNOWLEDGE_EMBEDDING_FAIL_SOFT:true}


  email:

    mode: ${EMAIL_MODE:logging}


  ia:

    provider: ${IA_PROVIDER:openai}


  openai:

    api-key: ${OPENAI_API_KEY:}

    model: ${OPENAI_MODEL:llama-3.3-70b-versatile}

    base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1}

    timeout-seconds: ${OPENAI_TIMEOUT:120}


  cache:

    rag-ttl-seconds: 60

    rag-max-size: 16


  pipeline:

    ocr:

      dpi: ${PIPELINE_OCR_DPI:150}

      max-pages: ${PIPELINE_OCR_MAX_PAGES:20}