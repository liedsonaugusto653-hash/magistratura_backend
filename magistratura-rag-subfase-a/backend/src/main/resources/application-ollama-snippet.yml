# MERGE no bloco app.ollama do application.yml:
app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    timeout-seconds: ${OLLAMA_TIMEOUT:300}
    # Qualidade / latência (IA local)
    temperature: ${OLLAMA_TEMPERATURE:0.25}
    top-p: ${OLLAMA_TOP_P:0.9}
    repeat-penalty: ${OLLAMA_REPEAT_PENALTY:1.2}
    num-predict: ${OLLAMA_NUM_PREDICT:600}
    num-ctx: ${OLLAMA_NUM_CTX:4096}
