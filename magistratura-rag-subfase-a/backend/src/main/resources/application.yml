spring:
  application:
    name: magistratura-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:magistratura}?sslmode=require
    username: ${DB_USER:magistratura}
    password: ${DB_PASSWORD:magistratura}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: ${DB_CONNECTION_INIT_SQL:}
      # Pool pequeno por omissão — free tier (512 MB). Sobrescrever com DB_POOL_SIZE em máquinas maiores.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:60000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    out-of-order: true
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # 15 MB: suficiente para diplomas típicos; evita OOM ao carregar PDF + raster OCR
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:15MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:15MB}

  # Tomcat: menos threads = menos stack memory reservada
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: ${TOMCAT_MIN_SPARE:2}
    accept-count: 25
    max-http-form-post-size: 15MB
    max-swallow-size: 15MB
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:

  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-minimum-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION:86400000}

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    timeout-seconds: ${OLLAMA_TIMEOUT:300}

  cache:
    # Cache pequeno: cada entrada RAG pode ter texto jurídico longo
    rag-ttl-seconds: ${CACHE_RAG_TTL_SECONDS:90}
    rag-max-size: ${CACHE_RAG_MAX_SIZE:64}

  ia:
    provider: ${IA_PROVIDER:ollama}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${GEMINI_TIMEOUT:120}
    temperature: ${GEMINI_TEMPERATURE:0.25}
    max-output-tokens: ${GEMINI_MAX_TOKENS:2048}

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: ${OPENAI_TIMEOUT:120}
    temperature: ${OPENAI_TEMPERATURE:0.25}
    max-tokens: ${OPENAI_MAX_TOKENS:2048}

  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openrouter/auto}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    timeout-seconds: ${OPENROUTER_TIMEOUT:120}
    temperature: ${OPENROUTER_TEMPERATURE:0.25}
    max-tokens: ${OPENROUTER_MAX_TOKENS:2048}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  biblioteca:
    storage-path: ${BIBLIOTECA_STORAGE_PATH:./storage/documentos}

  knowledge:
    vector-store: ${KNOWLEDGE_VECTOR_STORE:noop}
    embedding-provider: ${KNOWLEDGE_EMBEDDING_PROVIDER:ollama}
    embedding-model: ${KNOWLEDGE_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimensions: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:768}
    embedding-fail-soft: ${KNOWLEDGE_EMBEDDING_FAIL_SOFT:true}
    indexer: ${KNOWLEDGE_INDEXER:knowledge}
    default-top-k: 5

  pipeline:
    conhecimento-automatico: ${PIPELINE_CONHECIMENTO_AUTOMATICO:false}
    versao: 2.0.0
    lock-timeout: ${DB_LOCK_TIMEOUT:8s}

    ocr:
      enabled: ${PIPELINE_OCR_ENABLED:true}
      language: ${PIPELINE_OCR_LANGUAGE:por}
      datapath: ${PIPELINE_OCR_DATAPATH:}
      # 150 DPI: ~60% menos RAM por página vs 250; qualidade ainda boa para legislação
      dpi: ${PIPELINE_OCR_DPI:150}
      render-timeout-seconds: ${PIPELINE_OCR_RENDER_TIMEOUT:30}
      # Limite de páginas por documento no free tier (0 = sem limite em dev com RAM alta)
      max-pages: ${PIPELINE_OCR_MAX_PAGES:40}
      psm: ${PIPELINE_OCR_PSM:6}
      preprocess: ${PIPELINE_OCR_PREPROCESS:true}
      retry-binarize-below-chars: ${PIPELINE_OCR_RETRY_BINARIZE:30}
      min-chars-uteis: ${PIPELINE_OCR_MIN_CHARS:40}
      min-chars-por-pagina: ${PIPELINE_OCR_MIN_CHARS_PAGE:15}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    ao.magistratura: INFO
    org.springframework.security: INFO
