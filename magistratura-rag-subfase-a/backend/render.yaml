services:
  - type: web
    name: magistratura-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/ia/status
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: SERVER_PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: IA_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: KNOWLEDGE_VECTOR_STORE
        value: noop
      - key: KNOWLEDGE_EMBEDDING_FAIL_SOFT
        value: "true"
      - key: PIPELINE_OCR_ENABLED
        value: "true"
      - key: PIPELINE_OCR_DPI
        value: "180"
      - key: PIPELINE_OCR_RENDER_TIMEOUT
        value: "45"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false