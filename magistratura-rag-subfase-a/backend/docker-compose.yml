# Docker Compose apenas do backend + PostgreSQL, para desenvolvimento local desta fase.
# O docker-compose.yml final (com frontend e Ollama) será adicionado quando esses módulos existirem.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: magistratura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-magistratura}
      POSTGRES_USER: ${DB_USER:-magistratura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-magistratura}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-magistratura}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
